<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ title or "Formula Result - Handwritten Formula Recognition" }}</title>
  
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  
  <!-- Font Awesome 6 Icons -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" rel="stylesheet">
  
  <!-- Custom CSS -->
  <link href="/static/css/style.css" rel="stylesheet">

  <!-- MathJax Configuration & Library -->
  <script>
    MathJax = {
      tex: {
        inlineMath: [['$', '$'], ['\\(', '\\)']],
        displayMath: [['\\[', '\\]']]
      },
      svg: { fontCache: 'global' }
    };
  </script>
  <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
</head>
<body>

  <!-- Navigation Bar -->
  <nav class="navbar navbar-custom">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center gap-2" href="/">
        <i class="fas fa-square-root-variable fa-lg text-primary"></i>
        <span class="brand-badge">FormulaAI</span>
      </a>
      <a href="/" class="btn btn-outline-custom">
        <i class="fas fa-arrow-left me-2"></i> Upload New Image
      </a>
    </div>
  </nav>

  <!-- Main Container -->
  <main class="container py-5">
    <div class="row justify-content-center">
      <div class="col-lg-9">
        <div class="glass-card">
          <h3 class="fw-bold mb-4 d-flex align-items-center gap-2">
            <i class="fas fa-square-check text-success"></i> Recognition Result View
          </h3>

          <div class="row g-4">
            {% if image_url %}
            <div class="col-md-5">
              <div class="card h-100 border-0 bg-body-tertiary rounded-4 overflow-hidden shadow-sm">
                <div class="card-header bg-transparent border-bottom fw-bold small text-uppercase text-muted">
                  Input Image
                </div>
                <div class="card-body d-flex align-items-center justify-content-center p-3">
                  <img src="{{ image_url }}" alt="Input Image" class="img-fluid rounded" style="max-height: 240px; object-fit: contain;">
                </div>
              </div>
            </div>
            {% endif %}

            <div class="{% if image_url %}col-md-7{% else %}col-12{% endif %}">
              <div class="card h-100 border-0 bg-body-tertiary rounded-4 shadow-sm">
                <div class="card-header bg-transparent border-bottom d-flex align-items-center justify-content-between fw-bold small text-uppercase text-muted">
                  <span>LaTeX Output</span>
                </div>
                <div class="card-body p-3">
                  <div class="code-box">{{ prediction or "\\frac{5}{14}=\\frac{1}{x}" }}</div>
                </div>
              </div>
            </div>

            <div class="col-12">
              <div class="card border-0 bg-body-tertiary rounded-4 shadow-sm">
                <div class="card-header bg-transparent border-bottom fw-bold small text-uppercase text-muted">
                  Rendered Math Expression
                </div>
                <div class="card-body p-4 text-center">
                  <div class="rendered-math-box">
                    \[ {{ prediction or "\\frac{5}{14}=\\frac{1}{x}" }} \]
                  </div>
                </div>
              </div>
            </div>
          </div>
          
          <div class="mt-4 text-center">
            <a href="/" class="btn btn-gradient px-4">
              <i class="fas fa-rotate-left me-2"></i> Analyze Another Image
            </a>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
